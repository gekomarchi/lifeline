[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Each top-level call of a test runs as its own transaction: cold storage access and exact gas for
# each trigger of the fork harness.
isolate = true
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@reactive/=lib/reactive-lib-omni/",
]
# The ABI test reads the compiled artifact of LifelineHub.
fs_permissions = [{ access = "read", path = "./out" }]

[fmt]
line_length = 120
bracket_spacing = true

[lint]
# `forge lint` stays available. The build does not print its findings.
lint_on_build = false

[fuzz]
runs = 64

[rpc_endpoints]
lasna = "${LASNA_RPC_URL}"
