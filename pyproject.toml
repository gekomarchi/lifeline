[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lifeline"
version = "0.1.0"
description = "Lifeline: a gas guardian for reactive automations (testnet only)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
# The operator commands (`lifeline.ops`, `lifeline.forkrelay`) sign transactions and encode ABI data.
ops = ["eth-account>=0.13,<0.14"]
test = ["pytest>=7", "eth-account>=0.13,<0.14"]

[tool.setuptools]
packages = ["lifeline"]

[tool.pytest.ini_options]
testpaths = ["lifeline/tests"]
pythonpath = ["."]
