[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lifeline"
version = "0.1.0"
description = "Lifeline: a gas guardian for reactive automations (testnet only)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["lifeline"]

[tool.pytest.ini_options]
testpaths = ["lifeline/tests"]
pythonpath = ["."]
